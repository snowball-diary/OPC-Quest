# OPC Studio 发布工作流
# 将 pages/ + assets/ 合并后部署为 GitHub Pages 站点源
# 配合 OPC Studio 的 publish:run(git push origin main)触发
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只允许一次部署,避免冲突
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: 组装部署目录(合并 pages/ 和 assets/)
        run: |
          mkdir -p _site
          # 复制 pages 目录所有内容(HTML)
          cp -r pages/* _site/
          # 复制 assets 目录到部署根(HTML 引用 assets/xxx,需在根级)
          cp -r assets _site/assets
          # 列出最终部署内容,便于排查
          echo "=== _site 内容 ==="
          ls -la _site/
          echo "=== _site/assets 内容 ==="
          ls -la _site/assets/

      - name: Upload _site 为 Pages 产物
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
